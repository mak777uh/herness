# dsh-herness-room — комната herness внутри DeepSeek Harness
#
# Плагин добавляет вкладку «Комната» в интерфейс DSH: поле ввода, история,
# ответ с вердиктом PASS / FAIL / UNKNOWN.
#
# Задача уходит в очередь herness (`intake/`), выполняется в изолированной
# комнате (собственное ядро, шесть инструментов, без shell), результат
# возвращается в чат и одновременно пишется в журнал прогонов.
#
# Почему отдельный плагин, а не встроенный инструмент: комната — это часть
# харнесса, а не DSH. Плагин только показывает её.
- insert:
    - id: herness-room
      name: dsh-herness-room
      config:
        hernessRoot: "C:/111/herness"
        kernel: "vmlinuz-own-hardened2"
        timeoutSec: 420
