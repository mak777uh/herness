name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: гейты (профиль auto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Профиль auto: гейты, которым нужны runs/ или core-rs/target/, печатаются как N/A
      # с причиной (этих каталогов нет в git). Профиль full считает их провалом и
      # запускается на машине, где есть журналы и сборка: python bin/hs.py gates --profile full
      - name: Гейты
        run: python bin/hs.py gates --profile auto
      - name: Пре-регистрация пилота
        run: python bin/pilot_generator.py --verify
      - name: Свидетельства утверждений
        run: |
          python bin/check_artifacts.py C-0016
          python bin/check_artifacts.py C-0029

  claims:
    name: утверждения и их ожидания
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Быстрый режим: без сетевых и живых команд. Полный набор — на машине с сетью и ключом.
      - name: Проверка команд утверждений
        run: python bin/verify_claims.py --fast

  selftest:
    name: негативные тесты инструмента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Selftest
        run: python bin/hs.py selftest

  admission:
    name: допуск и test-only репетиция
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Зависимости Ed25519
        run: python -m pip install cryptography==46.0.5
      - name: Self-tests admission, promoter и owner-проверки
        run: |
          python bin/admission.py --self-test
          python bin/promoter.py --self-test
          python bin/verify_owner_package.py --self-test
      - name: Сборка head_slice_host и canonical_check
        working-directory: core-rs
        run: cargo build --release --bin head_slice_host --bin canonical_check
      # Независимый Rust-парсер JCS обязан совпасть с Python на канонизации,
      # допуске и отказе. Это не owner-церемония и не активация.
      - name: Дифференциальная проверка JCS (Python vs Rust)
        run: python bin/differential_admission.py --vectors 32
      # Launch идёт только через memfd/execveat. Если среда запретит syscall,
      # это будет видно как FAIL, а не заменено путём/TCG; локальное WSL-evidence
      # остаётся отдельным источником.
      - name: Test-only активационная репетиция
        run: python bin/activation_rehearsal.py --quiet --evidence /tmp/activation-rehearsal.txt
      # Положительная ветка: эфемерный ключ с anchor test_only=false, promoter без
      # --allow-test-only, песочный active. Production-файлы реестра только читаются.
      # Это не настоящий owner-ключ и не approval.
      - name: Сухая owner-церемония (положительная ветка, песочница)
        run: python bin/owner_ceremony_dry_run.py --quiet --evidence /tmp/owner-ceremony-dry-run.txt
      - name: Показать evidence при сбое
        if: failure()
        run: |
          cat /tmp/activation-rehearsal.txt 2>/dev/null || true
          cat /tmp/owner-ceremony-dry-run.txt 2>/dev/null || true

  rust:
    name: Rust-тесты ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --lib
        working-directory: core-rs
        run: cargo test --lib

  plugin:
    name: плагин (кадры HSJ2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Кадры журнала: CRC, версия, непрерывность"
        run: node plugin/test/journal.test.js
