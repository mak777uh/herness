<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Голосовалка A1…A16</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --txt:#e6e9ef; --dim:#8b93a3; --acc:#5b9dff; --ok:#5ad17a; --warn:#ffb347; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { padding:22px 20px 6px; max-width:880px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 6px; }
  .hint { color:var(--dim); font-size:13px; margin:6px 0 0; }
  main { max-width:880px; margin:0 auto; padding:8px 20px 130px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0; }
  .q { font-weight:600; margin-bottom:8px; }
  label.opt { display:flex; gap:9px; align-items:flex-start; padding:6px 8px; border-radius:8px; cursor:pointer; }
  label.opt:hover { background:#1d2129; }
  label.opt input { margin-top:3px; accent-color:var(--acc); }
  label.preset { outline:1px dashed #35507d; }
  .tag { font-size:11px; color:var(--acc); border:1px solid #35507d; border-radius:6px; padding:0 5px; margin-left:6px; }
  input[type=text], textarea { width:100%; margin-top:6px; background:#0c0e12; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#12151b; border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; z-index:50; }
  button { background:var(--acc); color:#06101f; border:0; border-radius:9px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--txt); border:1px solid var(--line); }
  #banner { display:none; background:#3a1d1d; color:#ffb3b3; border:1px solid #6b2b2b; border-radius:10px; padding:10px 14px; margin:12px auto; max-width:880px; }
  dialog { border:1px solid var(--line); border-radius:14px; background:#12151b; color:var(--txt); width:min(760px,92vw); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  #status { font-size:13px; color:var(--dim); margin:8px 0 0; min-height:18px; }
  #status.ok { color:var(--ok); }
  #status.warn { color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Голосовалка: A1…A16</h1>
  <p class="hint">Пунктиром отмечено то, что ты уже говорил в чате — поменяй, если передумал.
  Пустой вопрос — тоже ответ: запишу как допущение, а не как твоё решение.</p>
</header>
<div id="banner"></div>
<main id="form"></main>

<dialog id="dlg">
  <div class="q">Готовый ответ</div>
  <textarea id="out" spellcheck="false"></textarea>
  <p id="status"></p>
  <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:12px;">
    <button id="copy">Копировать</button>
    <button id="close" class="ghost">Закрыть</button>
  </div>
</dialog>

<div class="bar">
  <button id="build">Собрать ответ</button>
  <button id="reset" class="ghost">Сбросить</button>
</div>

<script>
window.onerror = function (msg) {
  var b = document.getElementById("banner");
  b.style.display = "block";
  b.textContent = "Ошибка страницы: " + msg + " — напиши в чат, починю.";
};

var Q = [
  { id:"A1", q:"Что для тебя «быстрее»?", opts:["меньше календарных минут на задачу (латентность)","больше задач за день (пропускная способность)","меньше твоего участия (автономность)"] },
  { id:"A2", q:"Сколько минут в день готов тратить на подтверждения?", opts:["0–5 минут","5–15 минут","15–60 минут","больше часа"] },
  { id:"A3", q:"Три задачи, которые должны работать в v1", type:"lines" },
  { id:"A4", q:"Что категорически нельзя?", multi:true, opts:["облако / чужие серверы","Docker / контейнеры","автопубликация наружу","автокоммит в репозитории","ничего из перечисленного"] },
  { id:"A5", q:"ОС основной среды", opts:["остаёмся на Windows","переезжаем на Linux","WSL как основная среда","решаем позже (после замеров)"] },
  { id:"A6", q:"Месячный бюджет на API", opts:["до $10","$10–50","$50–200","больше $200"] },
  { id:"A7", q:"Интерфейс для v1", opts:["достаточно CLI","нужен GUI","CLI сейчас, GUI в M6"] },
  { id:"A8", q:"Может ли харнесс коммитить от твоего имени?", opts:["да, в рабочие ветки","только диффы, коммичу я","да, но только в отдельную ветку"] },
  { id:"A9", q:"Кто ещё будет пользоваться?", opts:["только я","ещё люди","публично"] },
  { id:"A10", q:"Что считается «готово» для v1?", opts:["демо, которое я вижу","репозиторий с зелёными гейтами","метрика","другой человек прошёл сценарий"] },
  { id:"A11", q:"Сессии DSH", opts:["начать с чистых","перенести существующие","решить позже"] },
  { id:"A12", q:"Публичный репозиторий?", opts:["да","нет, приватно","позже решим"] },
  { id:"A13", q:"Что за машина для хоста?", opts:["выделенный мини-ПК / сервер","VPS / аренда","эта же машина","ещё не решено"] },
  { id:"A14", q:"Как подключаться?", opts:["богатое приложение с UI + минимальный веб как аварийный","только веб","только CLI"], preset:0, tag:"уже говорил" },
  { id:"A15", q:"Хост всегда включён?", opts:["да, круглосуточно","по требованию","гибрид (ночью — автономные прогоны)"] },
  { id:"A16", q:"Что харнесс видит из данных?", opts:["только git-репозитории (клон)","репозитории + каталог проекта","сейчас пишем харнесс, миграция позже"], preset:2, tag:"уже говорил" }
];

function el(tag, attrs, text) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

(function render() {
  var form = document.getElementById("form");
  Q.forEach(function (item) {
    var sec = el("section");
    sec.appendChild(el("div", { "class": "q" }, item.id + ". " + item.q));

    if (item.type === "lines") {
      for (var i = 1; i <= 3; i++) {
        var inp = el("input", { type: "text", "data-q": item.id, "data-line": String(i) });
        inp.placeholder = "задача " + i;
        sec.appendChild(inp);
      }
    } else {
      var type = item.multi ? "checkbox" : "radio";
      item.opts.forEach(function (o, oi) {
        var lab = el("label", { "class": "opt" });
        var box = el("input", { type: type, name: item.id, value: o });
        if (!item.multi && item.preset === oi) { box.checked = true; lab.className = "opt preset"; }
        lab.appendChild(box);
        var span = el("span", null, o);
        if (!item.multi && item.preset === oi && item.tag) span.appendChild(el("span", { "class": "tag" }, item.tag));
        lab.appendChild(span);
        sec.appendChild(lab);
      });
      var extra = el("input", { type: "text", "data-q": item.id, "data-extra": "1" });
      extra.placeholder = "или своё (необязательно)";
      sec.appendChild(extra);
    }
    form.appendChild(sec);
  });

  var freeSec = el("section");
  freeSec.appendChild(el("div", { "class": "q" }, "Свободное поле — что ещё я должен знать?"));
  var ta = el("textarea", { id: "free" });
  ta.placeholder = "уточнения, ограничения, страхи, идеи";
  freeSec.appendChild(ta);
  form.appendChild(freeSec);
})();

function collect() {
  var rows = [];
  Q.forEach(function (item) {
    var value = "";
    if (item.type === "lines") {
      var lines = [];
      document.querySelectorAll('input[data-q="' + item.id + '"]').forEach(function (i) {
        if (i.value.trim()) lines.push(i.value.trim());
      });
      value = lines.map(function (l, idx) { return (idx + 1) + ") " + l; }).join("; ");
    } else if (item.multi) {
      var picked = [];
      document.querySelectorAll('input[type=checkbox][name="' + item.id + '"]:checked').forEach(function (i) {
        picked.push(i.value);
      });
      value = picked.join(", ");
    } else {
      var r = document.querySelector('input[type=radio][name="' + item.id + '"]:checked');
      value = r ? r.value : "";
    }
    var extra = document.querySelector('input[data-q="' + item.id + '"][data-extra]');
    if (extra && extra.value.trim()) value = value ? (value + " — " + extra.value.trim()) : extra.value.trim();
    rows.push([item.id, item.q, value || "— (не заполнено, беру допущение)"]);
  });
  return rows;
}

document.getElementById("build").onclick = function () {
  var d = new Date().toLocaleString("ru-RU");
  var md = ["# ОТВЕТЫ ВЛАДЕЛЬЦА — " + d, ""];
  collect().forEach(function (r) { md.push(r[0] + ". " + r[1]); md.push("   → " + r[2]); });
  md.push("", "## Свободное поле", document.getElementById("free").value.trim() || "—");

  var out = document.getElementById("out");
  out.value = md.join("\n");
  var st = document.getElementById("status");
  st.className = "";
  st.textContent = out.value.length + " символов. Скопируй кнопкой или выдели текст и нажми Ctrl+C.";
  var dlg = document.getElementById("dlg");
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "open");
  out.focus();
  out.select();
};

document.getElementById("copy").onclick = function () {
  var out = document.getElementById("out");
  var st = document.getElementById("status");
  function done(ok, why) {
    st.className = ok ? "ok" : "warn";
    st.textContent = ok ? "Скопировано. Вставляй в чат." :
      "Браузер не дал доступ к буферу (" + why + "). Текст выделен — нажми Ctrl+C.";
    if (!ok) { out.focus(); out.select(); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(out.value).then(function () { done(true); },
      function (e) {
        var ok = false;
        try { out.focus(); out.select(); ok = document.execCommand("copy"); } catch (_) { ok = false; }
        done(ok, e && e.message ? e.message : "нет прав");
      });
  } else {
    var ok = false;
    try { out.focus(); out.select(); ok = document.execCommand("copy"); } catch (_) { ok = false; }
    done(ok, "старый браузер");
  }
};

document.getElementById("close").onclick = function () {
  var dlg = document.getElementById("dlg");
  if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
};

document.getElementById("reset").onclick = function () {
  if (confirm("Сбросить все ответы?")) location.reload();
};
</script>
</body>
</html>
